<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3c0"/>
      <stop offset="1" stop-color="#eef7e6"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9e63"/>
      <stop offset="1" stop-color="#3e6b3a"/>
    </linearGradient>
  </defs>
  <!-- 天空 -->
  <rect width="900" height="1200" fill="url(#sky)"/>
  <!-- 远山 -->
  <path d="M0 520 L140 360 L300 520 L460 300 L620 520 L780 340 L900 520 L900 1200 L0 1200 Z" fill="#9cc29a" opacity="0.85"/>
  <!-- 中景树林 -->
  <g fill="#5d8f52">
    <path d="M-20 700 q90 -220 180 0 q -40 -170 30 -330 q120 150 60 330 q -10 -120 60 -260 q110 130 60 260 q10 -150 80 -300 q90 140 50 300 q20 -110 90 -220 q90 110 30 220 q20 -120 80 -250 q70 130 10 250 q30 -100 80 -180 q60 90 0 180 L-20 700 Z" opacity="0.6"/>
  </g>
  <!-- 近景草地 -->
  <rect y="700" width="900" height="500" fill="url(#ground)"/>
  <!-- 阳光光束 -->
  <g opacity="0.22" fill="#fff">
    <polygon points="200,0 240,0 520,700 480,700"/>
    <polygon points="420,0 460,0 700,700 660,700"/>
    <polygon points="640,0 660,0 820,700 800,700"/>
  </g>
  <!-- 湖泊 -->
  <ellipse cx="660" cy="800" rx="170" ry="70" fill="#bfe8ea" opacity="0.9"/>
  <ellipse cx="660" cy="800" rx="150" ry="52" fill="#8ed3da" opacity="0.8"/>
  <!-- 木屋/养生馆 -->
  <g transform="translate(120 560)">
    <rect width="180" height="130" fill="#a97c50"/>
    <polygon points="-10,0 90,-80 190,0" fill="#8a5a36"/>
    <rect x="30" y="50" width="46" height="80" fill="#f7ead2"/>
    <rect x="104" y="50" width="46" height="80" fill="#f7ead2"/>
    <rect x="70" y="120" width="40" height="10" fill="#6e4526"/>
    <rect x="78" y="10" width="24" height="28" fill="#6e4526"/>
    <rect x="0" y="124" width="180" height="8" fill="#7c5530"/>
  </g>
  <!-- 散步小径 + 两位长者剪影 -->
  <path d="M80 1180 Q 260 1000 500 980 T 860 940" stroke="#efe6cf" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.9"/>
  <g fill="#2c4633">
    <circle cx="430" cy="968" r="9"/>
    <path d="M424 976 l-8 16 h16 l-2-12 z"/>
    <circle cx="452" cy="972" r="9"/>
    <path d="M446 980 l-8 16 h16 l-2-12 z"/>
  </g>
  <!-- 前景树 -->
  <g>
    <rect x="30" y="760" width="34" height="180" fill="#7a5230"/>
    <circle cx="47" cy="730" r="95" fill="#4c8a44" opacity="0.9"/>
    <circle cx="-10" cy="770" r="60" fill="#3d7636" opacity="0.85"/>
  </g>
  <text x="450" y="1120" font-size="30" fill="#fff" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" opacity="0.9" font-weight="bold">森林康养基地 · 园区实景示意图</text>
</svg>
